# Open the Claude sessions picker with prefix + C-i.
# Terminals send C-i as Tab unless tmux extended-keys are on, so bind both.
# This replaces the default prefix + Tab binding.
bind C-i display-popup -E -w 104 -h 60% "~/.local/bin/claude-tasks"
bind Tab display-popup -E -w 104 -h 60% "~/.local/bin/claude-tasks"
